services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: project3-backend
    restart: unless-stopped

    ports:
      - "8000:5000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: project3-db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
