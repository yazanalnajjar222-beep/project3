name: Project3 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Build application
        run: |
          docker compose build --no-cache

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop old containers
        run: |
          docker compose down || true

      - name: Deploy application
        run: |
          docker compose up -d --build

      - name: Check deployment
        run: |
          docker compose ps
          docker ps

      - name: Show logs if failed
        if: failure()
        run: |
          docker compose logs

      - name: Health check
        run: |
          sleep 15
          curl -f http://127.0.0.1:8000 || exit 1
